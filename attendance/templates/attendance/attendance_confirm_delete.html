{% extends 'attendance/base.html' %}

{% load static %}
{% block title %} Удаление {% endblock %}
{% block content %}
 <div class="container h-50 d-flex align-items-center justify-content-center" style="min-height: 80vh;">
     <div class="row w-50 justify-content-center">
         <div class="col-12">
             <form method="post" enctype="multipart/form-data">
                 <div class="card w-100">
                     <div class="card-header text-center">
                         <h5 class="card-title mt-2" style="min-height: 30px;">
                             Вы действительно хотите удалить "{{ object.name }}"?
                         </h5>
                     </div>
                     <div class="card-body d-flex flex-column justify-content-between">
                         {% csrf_token %}
                     </div>
                     <div class="card-footer d-flex justify-content-between">
                         <a class="btn btn-warning" href="{% url 'attendance:index' %}" role="button">Отмена</a>
                         <button type="submit" class="btn btn-danger">Удалить</button>
                     </div>
                 </div>
             </form>
         </div>
     </div>
 </div>
{% endblock %}
