{% load static %}
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'attendance:index' %}">
            <img src="{% static 'img/bavaria-7219.png' %}" alt="Bavaria Stube" height="80" class="me-2">
            <span class="d-none d-lg-inline align-middle"
                  style="font-family: 'Times New Roman', serif; font-size: 1.5rem; color: #FFCC00;">BAVARIA STUBE</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item mx-2">
                    <a class="nav-link active" href="{% url 'attendance:index' %}">
                        <i class="bi bi-house-door me-1"></i> Главная
                    </a>
                </li>
                <li class="nav-item mx-2">
                    <a class="nav-link" href="{% url 'persons:restaurant' %}">
                        <i class="bi bi-info-circle me-1"></i> О ресторане
                    </a>
                </li>

                <li class="nav-item mx-2">
                    <a class="nav-link" href="{% url 'tables:tables' %}">
                        <i class="bi bi-calendar-check me-1"></i> Бронирование
                    </a>
                </li>

            </ul>
            <ul class="navbar-nav">

                <li class="nav-item mx-2 d-flex align-items-center">
                    {% if user.is_authenticated %}
                    <a class="nav-link me-3" href="{% url 'users:profile' %}">
                        <i class="bi bi-person-circle me-1"></i> Личный кабинет
                    </a>
                    <form method="post" action="{% url 'users:logout' %}" class="m-0 p-0">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-link nav-link p-0 m-0 align-baseline"
                                style="color: var(--bs-link-color); text-decoration: underline; font-size: 1rem;">
                            Выйти
                        </button>
                    </form>
                    {% else %}
                    <a class="nav-link" href="{% url 'users:login' %}">
                        <i class="bi bi-person-circle me-1"></i> Войти
                    </a>
                    {% endif %}
                </li>


            </ul>
        </div>
    </div>
</nav>
