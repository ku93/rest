{% extends 'attendance/base.html' %}
{% load static %}
{% block title %} Bavaria Stube | Вход в личный кабинет {% endblock %}
{% block content %}
<div class="container h-100 d-flex align-items-center justify-content-center">
    <form class="row w-50" method="post">
        <div class="card w-100">
            <div class="card-header text-center" style="background-color: var(--bavaria-red); color: white;">
                <h5 class="card-title mt-2" style="min-height: 40px;">
                    Вход в личный кабинет
                </h5>
            </div>
            <div class="card-body d-flex flex-column justify-content-between">
                {% csrf_token %}
                {{ form.as_p }}
                <input type="hidden" name="next" value="{{ request.GET.next }}">
            </div>
            <div class="card-footer d-flex justify-content-between align-items-center">
                <button type="submit" class="btn btn-primary text-uppercase fw-semibold px-4 py-2">
                    Войти
                </button>
                <div class="d-flex flex-column text-end">
                    <a href="{% url 'users:password_reset' %}" class="btn btn-link p-0 mb-1" style="color: var(--bavaria-red); text-decoration: underline;">
                        Забыли пароль?
                    </a>
                    <a href="{% url 'users:register' %}" class="btn btn-link p-0" style="color: var(--bavaria-red); text-decoration: underline;">
                        Зарегистрироваться
                    </a>
                </div>
            </div>
        </div>
    </form>
</div>
{% endblock %}
